interface:
  display_name: "Code Plan"
  short_description: "Turn a rough request into a precise, step-by-step implementation plan .md. Fully autonomous: no questions, no git."
  default_prompt: "Take the instructions from -d/--desc or the free text; with no instructions at all, stop with a one-line message (never invent a task, never ask). Save to -p/--path when given, otherwise to a git-ignored .plan folder at the repo root. Never ask a question, never request confirmation, never run git, never implement. Rewrite the instructions with the enhancement prompt, learn the project (verify commands, DESIGN.md, decision records, gstack learnings), apply up to 3 expert lenses, discover the codebase to saturation, and write a detailed plan with executable Verify lines, security designed into the steps, and an Experts & Tooling section that names only invokable experts. End with the report and the pipeline signal; chain --skill=<skill> only when it is chain-safe (code-execute) or the user named a plan review."
  brand_color: "#3B6EA5"

policy:
  allow_implicit_invocation: false
