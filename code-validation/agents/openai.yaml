interface:
  display_name: "Code Validation"
  short_description: "Validate an implementation against its plan .md: fix, complete, refactor to production grade, pass a security and production-readiness gate, prove it green, sweep it clean, delete the plan. Fully autonomous: no questions, no git writes."
  default_prompt: "Take the plan from -p/--path; without it, use the single plan in the repo root's .plan folder or the one the pipeline signals mark as waiting, and otherwise stop with a failed signal (never ask, never guess). Audit every plan item, fix everything found, refactor every touched file to production grade, run the security pass and the production-readiness gate, verify until green with bounded fix loops, delete generated test scaffolding, sweep the change zero-comment production-clean and run scripts/code_validation.py sweep-scan until it exits 0, then re-verify. Never modify the plan during validation; git is read-only inspection only (status, diff, show, ls-files, check-ignore). On success write the pipeline signal, then RUN `scripts/code_validation.py close-out --plan <PLAN_ABS>` and relay its PLAN DELETED line verbatim as the final line; never compose that line yourself. A failed audit keeps the plan."
  brand_color: "#2E8B57"

policy:
  allow_implicit_invocation: false
